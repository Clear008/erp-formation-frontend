server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compression des fichiers statiques
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Transmettre les appels API au backend Docker
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Autoriser les uploads GED jusqu'à 10 Mo
        client_max_body_size 10m;
    }

    # Endpoint de santé du frontend
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "UP\n";
    }

    # Support de React Router / BrowserRouter
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des ressources générées par Vite
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}