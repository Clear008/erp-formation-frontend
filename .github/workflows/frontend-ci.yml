name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-frontend:
    name: Installation et build React
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Afficher les versions
        run: |
          node --version
          npm --version

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le frontend
        run: npm run build


  build-docker:
    name: Vérification de l’image Docker frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-frontend

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l’image frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: erp-formation-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max